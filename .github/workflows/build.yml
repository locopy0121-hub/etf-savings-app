name: Build Android APK (Push node_modules)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies (Force)
        run: |
          npm install --legacy-peer-deps
          npm audit fix --force || true
          npm list @expo/vector-icons || npm install @expo/vector-icons --legacy-peer-deps
          npm audit fix --force || true
          echo "Dependencies installed and forced."

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK on EAS (Using local node_modules)
        run: |
          npx eas-cli project:init --force --non-interactive || true
          npx eas-cli build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
