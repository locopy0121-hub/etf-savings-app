name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: (Super Hack) Defuse Vector Icons
        run: |
          # 這段腳本會尋找 node_modules 中的 vector-icons 並移除其依賴定義
          find node_modules/@expo/vector-icons -name "package.json" -exec sed -i 's/"peerDependencies":.*},//g' {} +
          echo "Vector icons dependency constraints defused."

      - name: Build APK on EAS
        run: |
          npx eas-cli project:init --force --non-interactive || true
          npx eas-cli build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
