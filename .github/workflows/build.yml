name: Build Android APK (Zero Install)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Pack Project Sources
        run: |
          # 打包除了 .git 和 node_modules 以外的所有檔案
          tar -czf project.tar.gz . --exclude='.git' --exclude='node_modules' --exclude='project.tar.gz'
          echo "Project packed into project.tar.gz"

      - name: Build APK on EAS (Using Tarball)
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --clear-cache --source-tarball project.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
